<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="clinidiabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Medical Cross & Pulse Icon -->
  <g transform="translate(10, 8)" filter="url(#shadow)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#clinidiabGrad)" />
    <!-- White Medical Cross -->
    <path d="M 22 10 L 22 34 M 10 22 L 34 22" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Pulse Heartbeat line overlay -->
    <path d="M 12 22 L 17 22 L 19 16 L 22 28 L 25 19 L 27 22 L 32 22" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <!-- Text Brand -->
  <text x="64" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="24" fill="#0f172a" letter-spacing="-0.5">CLINI<tspan fill="#0284c7">DIAB</tspan></text>
  <text x="65" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9.5" fill="#64748b" letter-spacing="1.5">CONSULTORIO MÉDICO</text>
</svg>
